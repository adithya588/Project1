# The main pipeline for Project_Bundle

resources:
  pipelines:
    bronze_to_silver_earthquake_etl_pipeline:
      name: Bronze_Silver_Earthquake_Prod
      configuration:
        catalog_name: ${var.catalog}
      libraries:
        - glob:
            include: ../src/DLT_pipelines/Bronze_Silver/transformations/**
      schema: silver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      root_path: ../src/DLT_pipelines/Bronze_Silver
          

